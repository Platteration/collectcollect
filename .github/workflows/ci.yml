name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Weekly, for a tree nobody pushes to: GitHub runs a schedule from the default branch
  # only, where an advisory or a build that has rotted then shows within a week. Not at
  # the top of the hour, a high-load time when scheduled runs can be delayed or dropped
  # (CONVENTIONS.md, "CI").
  schedule:
    - cron: "17 6 * * 1"

# A newer run for the same ref supersedes an in-flight one. On the default branch the
# weekly run shares the group with pushes; whichever is cancelled, the other tests the
# branch's newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  # Every workspace's lint, types and unit tests, the conventions test, a production
  # build of both apps, and both end-to-end suites against those builds.
  # Every job runs on a named Ubuntu release (CONVENTIONS.md, "CI"), not ubuntu-latest,
  # which is Ubuntu 26.04 from 2026-10-19:
  # Playwright 1.56.1 has no Chromium build for 26.04, so the browser install below
  # would fail there with nothing in the repository changed. Raising Playwright is the
  # way to a newer runner; apps/cards/tests/ci-runner.test.ts asks the locked
  # Playwright whether it has a build for the release named here.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

  # Each app boots its own servers from a real build, so they run apart and in
  # parallel. Only the browser binary and Next's build cache are worth keeping
  # between runs; a stale build output is not.
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [cards, skins]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache the Playwright browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          # A lockfile change rarely changes the browser; the last one is a fine start.
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Cache the Next build
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/${{ matrix.app }}/.next/cache
          # Keyed on this app's own sources and the shared package, not on the
          # other app's: a change there is no reason to lose this build's cache.
          key: next-${{ matrix.app }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles(format('apps/{0}/**/*.ts', matrix.app), format('apps/{0}/**/*.tsx', matrix.app), 'packages/**/*.ts', 'packages/**/*.tsx') }}
          restore-keys: |
            next-${{ matrix.app }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build -w @collectcollect/${{ matrix.app }}
      - run: npx playwright install --with-deps chromium

      # Each app's suite drives a production build it makes itself, so the suite stays
      # self-contained locally; the build step above is what names a build failure as
      # its own. Both apps boot their own servers on their own ports (3210-3211 for
      # cards, 3220-3223 for skins) against throwaway data directories.
      - run: npm run test:e2e

      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-reports
          path: |
            apps/*/playwright-report/
            apps/*/test-results/
          retention-days: 7

  # The image is the thing people run, so it is built for both apps and the running
  # container is asked whether it is well.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [cards, skins]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          tags: collectcollect-${{ matrix.app }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

      - name: Boot the container and ask it how it is
        run: |
          docker run -d --name app -p 3000:3000 collectcollect-${{ matrix.app }}:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then echo; exit 0; fi
            sleep 2
          done
          echo "the container never answered"; docker logs app; exit 1

      - name: The image's own health check agrees
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs app; exit 1

      - name: It stops when asked, not when killed
        # Under a shell-form CMD node never receives SIGTERM, and `docker stop`
        # waits out its whole grace period before killing the container. With
        # node as PID 1 it is gone in well under that.
        run: |
          start=$(date +%s)
          docker stop -t 20 app
          took=$(( $(date +%s) - start ))
          echo "stopped in ${took}s"
          [ "$took" -lt 10 ]

  # Check every PR, including branches in this repository. High and critical
  # advisories are blocking rather than hidden behind a successful test job.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc

      - run: node .github/audit/npm-audit.mjs
