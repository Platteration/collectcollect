name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # Weekly, for a tree nobody pushes to: GitHub runs a schedule from the default branch
  # only, where an advisory or a build that has rotted then shows within a week. Not at
  # the top of the hour, a high-load time when scheduled runs can be delayed or dropped
  # (CONVENTIONS.md, "CI").
  schedule:
    - cron: "17 6 * * 1"

# A newer run for the same ref supersedes an in-flight one. On the default branch the
# weekly run shares the group with pushes; whichever is cancelled, the other tests the
# branch's newest commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository.
permissions:
  contents: read

jobs:
  # Every workspace's lint, types and unit tests, the conventions test, a production
  # build of both apps, and both end-to-end suites against those builds.
  # Every job runs on a named Ubuntu release (CONVENTIONS.md, "CI"), not ubuntu-latest,
  # which is Ubuntu 26.04 from 2026-10-19:
  # Playwright 1.56.1 has no Chromium build for 26.04, so the browser install below
  # would fail there with nothing in the repository changed. Raising Playwright is the
  # way to a newer runner; apps/cards/tests/ci-runner.test.ts asks the locked
  # Playwright whether it has a build for the release named here.
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run test:conventions

      - run: npm run build

      - run: npx playwright install --with-deps chromium

      # Each app's suite drives a production build it makes itself, so the suite stays
      # self-contained locally; the build step above is what names a build failure as
      # its own. Both apps boot their own servers on their own ports (3210-3211 for
      # cards, 3220-3223 for skins) against throwaway data directories.
      - run: npm run test:e2e

      - name: Upload the reports
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-reports
          path: |
            apps/*/playwright-report/
            apps/*/test-results/
          retention-days: 7

  # The image is the thing people run, so it is built for both apps and the running
  # container is asked whether it is well.
  docker:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [cards, skins]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          tags: collectcollect-${{ matrix.app }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

      - name: Boot the container and ask it how it is
        run: |
          docker run -d --name app -p 3000:3000 collectcollect-${{ matrix.app }}:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then echo; exit 0; fi
            sleep 2
          done
          echo "the container never answered"; docker logs app; exit 1

      - name: The image's own health check agrees
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs app; exit 1

      - name: It stops when asked, not when killed
        # Under a shell-form CMD node never receives SIGTERM, and `docker stop`
        # waits out its whole grace period before killing the container. With
        # node as PID 1 it is gone in well under that.
        run: |
          start=$(date +%s)
          docker stop -t 20 app
          took=$(( $(date +%s) - start ))
          echo "stopped in ${took}s"
          [ "$took" -lt 10 ]

  # Its own job, so that an advisory published against an unchanged tree turns audit red
  # on the next run (on the default branch, the weekly one at the latest) and leaves check
  # meaning what it always meant. The shared gate runs `npm audit --omit=dev`, which reads
  # the lockfile (no install), and fails on every high or critical advisory that
  # .github/audit/accepted.json does not accept; this repository keeps no such list, so it
  # accepts nothing (CONVENTIONS.md, "CI").
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - run: node .github/audit/npm-audit.mjs
