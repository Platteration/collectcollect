name: CI

# Every push runs the suite. A pull request from a branch in this repository
# would run it a second time for the same commit, so the pull_request event
# only counts when it comes from a fork, which a push here cannot cover.
on:
  push:
    branches: ["**"]
  pull_request:

# Nothing here writes to the repository.
permissions:
  contents: read

# A new push to the same branch supersedes the run in progress.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast and whole: every workspace's lint, types and unit tests in one job.
  check:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # Each app boots its own servers from a real build, so they run apart and in
  # parallel. Only the browser binary and Next's build cache are worth keeping
  # between runs; a stale build output is not.
  e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [cards, skins]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          # A lockfile change rarely changes the browser; the last one is a fine start.
          restore-keys: |
            playwright-${{ runner.os }}-
      - name: Cache the Next build
        uses: actions/cache@v4
        with:
          path: apps/${{ matrix.app }}/.next/cache
          # Keyed on this app's own sources and the shared package, not on the
          # other app's: a change there is no reason to lose this build's cache.
          key: next-${{ matrix.app }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles(format('apps/{0}/**/*.ts', matrix.app), format('apps/{0}/**/*.tsx', matrix.app), 'packages/**/*.ts', 'packages/**/*.tsx') }}
          restore-keys: |
            next-${{ matrix.app }}-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
      - run: npm run build -w @collectcollect/${{ matrix.app }}
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -w @collectcollect/${{ matrix.app }}
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.app }}
          path: |
            apps/${{ matrix.app }}/playwright-report/
            apps/${{ matrix.app }}/test-results/
          retention-days: 7

  # The image is the thing people run, so it is built for both apps and the
  # running container is asked whether it is well.
  docker:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        app: [cards, skins]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          build-args: APP=${{ matrix.app }}
          tags: collectcollect-${{ matrix.app }}:ci
          load: true
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max
      - name: Boot the container and ask it how it is
        run: |
          docker run -d --name app -p 3000:3000 collectcollect-${{ matrix.app }}:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health; then echo; exit 0; fi
            sleep 2
          done
          echo "the container never answered"; docker logs app; exit 1
      - name: The image's own health check agrees
        run: |
          for i in $(seq 1 30); do
            status=$(docker inspect --format '{{.State.Health.Status}}' app)
            echo "health: $status"
            [ "$status" = healthy ] && exit 0
            sleep 2
          done
          docker logs app; exit 1
      - name: It stops when asked, not when killed
        # Under a shell-form CMD node never receives SIGTERM, and `docker stop`
        # waits out its whole grace period before killing the container. With
        # node as PID 1 it is gone in well under that.
        run: |
          start=$(date +%s)
          docker stop -t 20 app
          took=$(( $(date +%s) - start ))
          echo "stopped in ${took}s"
          [ "$took" -lt 10 ]
      - if: always()
        run: docker rm -f app

  # Advisory: a known vulnerability in a dependency is worth seeing on every
  # run, but not worth blocking a fix for something else.
  audit:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
