# Two apps, two images, two volumes. They share code and nothing else: separate
# databases, separate directories, separate passwords.
#
#   docker compose up --build            # both
#   docker compose up --build cards      # just the card app
services:
  cards:
    build:
      context: .
      args:
        APP: cards
    # Bound to this machine only. Neither app speaks TLS and a password is
    # optional, so exposing a port to the network is a decision, not a default;
    # put a reverse proxy in front and change the bind address there.
    ports:
      - "127.0.0.1:3000:3000"
    # Optional: the apps run with no .env at all. What each one reads from it
    # is listed in .env.example — the card app its own variables, the skins
    # app the SKINS_-prefixed ones.
    env_file:
      - path: .env
        required: false
    # The data directory is the volume, whatever .env says: `environment` wins
    # over `env_file`, so a DATA_DIR meant for a shell install cannot point the
    # container at its own writable layer, where a collection would vanish with
    # the container.
    environment:
      DATA_DIR: /data
    volumes:
      - collectcollect-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

  skins:
    build:
      context: .
      args:
        APP: skins
    ports:
      - "127.0.0.1:3001:3000"
    env_file:
      - path: .env
        required: false
    environment:
      SKINS_DATA_DIR: /data
    volumes:
      - collectcollect-skins-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  collectcollect-data:
  collectcollect-skins-data:
